[workspace]
resolver = "2"
members = [
    "crates/orbit-syntax",
    "crates/orbit-ir",
    "crates/orbit-compiler",
    "crates/orbit-runtime",
    "crates/orbit-cli",
    "crates/orbit-worker",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["ORBIT contributors"]
homepage = "https://github.com/AjmalX0/Orbit"
readme = "README.md"
repository = "https://github.com/AjmalX0/Orbit"

[workspace.dependencies]
orbit-syntax = { path = "crates/orbit-syntax", version = "0.2.0" }
orbit-ir = { path = "crates/orbit-ir", version = "0.2.0" }
orbit-compiler = { path = "crates/orbit-compiler", version = "0.2.0" }
orbit-runtime = { path = "crates/orbit-runtime", version = "0.2.0" }
orbit-worker = { path = "crates/orbit-worker", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
rusqlite = { version = "0.42", features = ["bundled"] }
postgres = "0.19"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
x509-parser = "0.18"
toml = "1"
rustls-pemfile = "2"
axum = "0.8"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
protox = "0.7"
axum-server = { version = "0.9", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
