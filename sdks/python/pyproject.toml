[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-sdk"
version = "0.1.0"
description = "Python worker SDK for the ORBIT orchestration runtime"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools]
packages = ["orbit_sdk"]
