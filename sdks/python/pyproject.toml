[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-lang-sdk"
version = "0.5.0"
description = "Python worker SDK for the ORBIT orchestration runtime"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ORBIT contributors" }]
keywords = ["orbit", "workflow", "workflow-engine", "orchestration", "durable-execution", "saga", "worker", "temporal-alternative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://ajmalx0.github.io/Orbit/"
Documentation = "https://ajmalx0.github.io/Orbit/docs/sdks/python.html"
Source = "https://github.com/AjmalX0/Orbit"
Changelog = "https://github.com/AjmalX0/Orbit/blob/main/CHANGELOG.md"
Issues = "https://github.com/AjmalX0/Orbit/issues"

[tool.setuptools]
packages = ["orbit_sdk"]

[tool.setuptools.package-data]
orbit_sdk = ["py.typed"]
