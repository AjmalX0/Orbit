name: Feature request
description: Propose a language, runtime or tooling improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What are you trying to do, and what gets in the way?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: "For language changes, include example .orbit syntax and the intended semantics." }
