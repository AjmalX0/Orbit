name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test
      - name: TypeScript SDK typecheck
        run: npx -y -p typescript@6.0.2 tsc -p sdks/typescript/tsconfig.json --noEmit
      - name: End-to-end (server + Python + TypeScript workers, crash recovery)
        run: cargo build && python3 -I tests/e2e/test_e2e.py
