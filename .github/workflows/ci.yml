name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Format
        run: |
          cargo fmt --all --check
          test -z "$(gofmt -l sdks/go examples/workers/polyglot/go)"
      - name: Lint
        run: |
          cargo clippy --all-targets -- -D warnings
          (cd sdks/go && go vet ./...)
          (cd examples/workers/polyglot/go && go vet ./...)
      - name: Rust tests (compiler, IR, runtime, CLI, Rust SDK)
        run: cargo test
      - name: Python SDK tests
        run: PYTHONPATH=sdks/python python3 -m unittest discover -s sdks/python/tests
      - name: TypeScript SDK typecheck and tests
        run: |
          npx -y -p typescript@6.0.2 tsc -p sdks/typescript/tsconfig.json --noEmit
          cd sdks/typescript && npm test
      - name: Go SDK tests
        run: cd sdks/go && go test -race ./...
      - name: End-to-end (4 languages, crash recovery, TLS and credentials)
        run: cargo build && python3 -I tests/e2e/test_e2e.py
