<svg xmlns="http://www.w3.org/2000/svg" class="orbit-graph" width="588" height="411" viewBox="0 0 588 411" role="img" aria-label="Step graph of workflow Subscription">
<title>Subscription@1.0.0</title>
<style>
.orbit-graph { --ink: #1c1917; --muted: #57534e; --line: #a8a29e; --bg: #faf9f7; --band: #f3f1ed; --accent: #c2410c; }
@media (prefers-color-scheme: dark) { .orbit-graph { --ink: #ece9e4; --muted: #a8a29e; --line: #6b6560; --bg: #0f0d0c; --band: #161412; --accent: #fb923c; } }
.orbit-graph text { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--muted); }
.orbit-graph text.name { font-weight: 600; fill: var(--ink); }
.orbit-graph .node { fill: var(--bg); stroke: var(--ink); stroke-width: 1.2; }
.orbit-graph .conditional { stroke: var(--accent); }
.orbit-graph .compensation { stroke-dasharray: 5 3; stroke: var(--muted); }
.orbit-graph .continue { stroke: var(--accent); }
.orbit-graph .continue.inner { fill: none; }
.orbit-graph .edge { fill: none; stroke: var(--line); stroke-width: 1.3; }
.orbit-graph .edge.dashed { stroke-dasharray: 5 3; }
.orbit-graph .panel { fill: var(--band); stroke: var(--line); stroke-dasharray: 4 3; }
.orbit-graph .title { font-weight: 600; fill: var(--ink); }
.orbit-graph .arrow { fill: var(--line); }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<path class="edge" d="M248.0,104.0 C248.0,127.0 248.0,127.0 248.0,148.0" marker-end="url(#arrow)"/>
<path class="edge" d="M248.0,196.0 C248.0,219.0 248.0,219.0 248.0,240.0" marker-end="url(#arrow)"/>
<path class="edge" d="M248.0,288.0 C248.0,311.0 248.0,311.0 248.0,332.0" marker-end="url(#arrow)"/>
<path class="edge dashed" d="M480.0,364.5 L498.0,364.5 L498.0,16.0 L248.0,16.0 L248.0,26.0" marker-end="url(#arrow)"/>
<text x="503.0" y="190.2">next run</text>
